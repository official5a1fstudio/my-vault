name: Build my_vault_rs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v0.1.0). Creates/updates a GitHub Release with artifacts.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libclang-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libgtk-3-dev \
            libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Linux)
        run: cargo check --all-targets --target x86_64-unknown-linux-gnu 2>&1 | tee check-linux.log; exit ${PIPESTATUS[0]}

      - name: Upload Linux check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-linux
          path: check-linux.log
          if-no-files-found: warn

      - name: Test (Linux)
        run: cargo test --all-targets --target x86_64-unknown-linux-gnu

      - name: Build release (Linux)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist_test
          cp target/x86_64-unknown-linux-gnu/release/my_vault_rs dist_test/my_vault_rs-linux-x86_64
          chmod +x dist_test/my_vault_rs-linux-x86_64
          (cd dist_test && sha256sum my_vault_rs-linux-x86_64 > my_vault_rs-linux-x86_64.sha256)
          ls -la dist_test

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-linux-x86_64
          path: |
            dist_test/my_vault_rs-linux-x86_64
            dist_test/my_vault_rs-linux-x86_64.sha256
          if-no-files-found: error

  windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check --all-targets --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath check-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-windows
          path: check-windows.log
          if-no-files-found: warn

      - name: Test (Windows)
        run: cargo test --all-targets --target x86_64-pc-windows-msvc

      - name: Build release (Windows)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_test | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/my_vault_rs.exe dist_test/my_vault_rs-windows-x86_64.exe
          $hash = (Get-FileHash dist_test/my_vault_rs-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  my_vault_rs-windows-x86_64.exe" | Set-Content -Encoding ascii dist_test/my_vault_rs-windows-x86_64.exe.sha256
          Get-ChildItem dist_test

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-windows-x86_64
          path: |
            dist_test/my_vault_rs-windows-x86_64.exe
            dist_test/my_vault_rs-windows-x86_64.exe.sha256
          if-no-files-found: error

  debian:
    name: Build Debian (x86_64 .deb)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev \
            libclang-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libegl-dev libgbm-dev libgtk-3-dev \
            libasound2-dev git

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Debian)
        shell: bash
        run: cargo check --all-targets --target x86_64-unknown-linux-gnu 2>&1 | tee check-debian.log; exit ${PIPESTATUS[0]}

      - name: Upload Debian check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-debian
          path: check-debian.log
          if-no-files-found: warn

      - name: Test (Debian)
        run: cargo test --all-targets --target x86_64-unknown-linux-gnu

      - name: Build release (Debian)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Debian artifact
        run: |
          mkdir -p dist_test/deb/usr/local/bin
          cp target/x86_64-unknown-linux-gnu/release/my_vault_rs dist_test/deb/usr/local/bin/my_vault_rs
          chmod +x dist_test/deb/usr/local/bin/my_vault_rs
          mkdir -p dist_test/deb/DEBIAN
          cat > dist_test/deb/DEBIAN/control <<'CTRL'
          Package: my-vault-rs
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: 5A1F Studio <official5a1fstudio@users.noreply.github.com>
          Description: my_vault_rs - local password manager and TOTP authenticator
          CTRL
          dpkg-deb --build dist_test/deb dist_test/my-vault-rs_0.1.0_amd64.deb
          cp target/x86_64-unknown-linux-gnu/release/my_vault_rs dist_test/my_vault_rs-debian-x86_64
          (cd dist_test && sha256sum my-vault-rs_0.1.0_amd64.deb my_vault_rs-debian-x86_64 > my_vault_rs-debian.sha256)
          ls -la dist_test

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-debian-x86_64
          path: |
            dist_test/my-vault-rs_0.1.0_amd64.deb
            dist_test/my_vault_rs-debian-x86_64
            dist_test/my_vault_rs-debian.sha256
          if-no-files-found: error

  android:
    name: Build Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Configure Android NDK and cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk --locked

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Android)
        run: cargo ndk -t arm64-v8a check --lib 2>&1 | tee check-android.log; exit ${PIPESTATUS[0]}

      - name: Upload Android check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-android
          path: check-android.log
          if-no-files-found: warn

      - name: Build release (Android)
        run: cargo ndk -t arm64-v8a -o dist_test/android build --release --lib

      - name: Collect Android artifacts
        run: |
          mkdir -p dist_test
          find dist_test/android -type f -maxdepth 4 -print || true
          (cd dist_test && tar -czf my_vault_rs-android-arm64-native.tar.gz android)
          (cd dist_test && sha256sum my_vault_rs-android-arm64-native.tar.gz > my_vault_rs-android-arm64-native.tar.gz.sha256)
          ls -la dist_test

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-android-arm64
          path: |
            dist_test/my_vault_rs-android-arm64-native.tar.gz
            dist_test/my_vault_rs-android-arm64-native.tar.gz.sha256
            dist_test/android/**
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: [linux, windows, android, debian]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find release_artifacts -type f \( -name '*.exe' -o -name '*.sha256' -o -name '*linux-x86_64' -o -name '*debian-x86_64' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.so' \) -exec cp {} release_assets/ \;
          ls -la release_assets

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: my_vault_rs ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
