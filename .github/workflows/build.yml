name: Build my_vault_rs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v0.1.1). Creates/updates a GitHub Release with artifacts.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libclang-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libgtk-3-dev \
            libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Linux)
        run: cargo check --all-targets --target x86_64-unknown-linux-gnu 2>&1 | tee check-linux.log; exit ${PIPESTATUS[0]}

      - name: Upload Linux check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-linux
          path: check-linux.log
          if-no-files-found: warn

      - name: Show Linux check log on failure
        if: failure()
        shell: bash
        run: |
          echo '### Linux check log' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat check-linux.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Test (Linux)
        run: cargo test --all-targets --target x86_64-unknown-linux-gnu

      - name: Build release (Linux)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist_test
          cp target/x86_64-unknown-linux-gnu/release/my_vault_rs dist_test/my_vault_rs-linux-x86_64
          chmod +x dist_test/my_vault_rs-linux-x86_64
          ls -la dist_test

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-linux-x86_64
          path: dist_test/my_vault_rs-linux-x86_64
          if-no-files-found: error

  windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check --all-targets --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath check-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-windows
          path: check-windows.log
          if-no-files-found: warn

      - name: Show Windows check log on failure
        if: failure()
        shell: pwsh
        run: |
          '### Windows check log' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          '```text' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-Content check-windows.log | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Test (Windows)
        run: cargo test --all-targets --target x86_64-pc-windows-msvc

      - name: Build release (Windows)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_test | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/my_vault_rs.exe dist_test/my_vault_rs-windows-x86_64.exe
          Get-ChildItem dist_test

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-windows-x86_64
          path: dist_test/my_vault_rs-windows-x86_64.exe
          if-no-files-found: error

  debian:
    name: Build Debian (x86_64 .deb)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl ca-certificates build-essential pkg-config libssl-dev \
            libclang-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libegl-dev libgbm-dev libgtk-3-dev \
            libasound2-dev git

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Debian)
        shell: bash
        run: cargo check --all-targets --target x86_64-unknown-linux-gnu 2>&1 | tee check-debian.log; exit ${PIPESTATUS[0]}

      - name: Upload Debian check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-debian
          path: check-debian.log
          if-no-files-found: warn

      - name: Show Debian check log on failure
        if: failure()
        shell: bash
        run: |
          echo '### Debian check log' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat check-debian.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Test (Debian)
        run: cargo test --all-targets --target x86_64-unknown-linux-gnu

      - name: Build release (Debian)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Debian artifact
        run: |
          mkdir -p dist_test/deb/usr/local/bin
          cp target/x86_64-unknown-linux-gnu/release/my_vault_rs dist_test/deb/usr/local/bin/my_vault_rs
          chmod +x dist_test/deb/usr/local/bin/my_vault_rs
          mkdir -p dist_test/deb/DEBIAN
          cat > dist_test/deb/DEBIAN/control <<'CTRL'
          Package: my-vault-rs
          Version: 0.1.1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: 5A1F Studio <official5a1fstudio@users.noreply.github.com>
          Description: Mawthooq - local password manager and TOTP authenticator
          CTRL
          dpkg-deb --build dist_test/deb dist_test/my-vault-rs_0.1.1_amd64.deb
          ls -la dist_test

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-debian-x86_64
          path: dist_test/my-vault-rs_0.1.1_amd64.deb
          if-no-files-found: error

  android:
    name: Build Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Configure Android NDK and cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk --locked

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check (Android)
        run: cargo ndk -t arm64-v8a check --lib 2>&1 | tee check-android.log; exit ${PIPESTATUS[0]}

      - name: Upload Android check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-android
          path: check-android.log
          if-no-files-found: warn

      - name: Show Android check log on failure
        if: failure()
        shell: bash
        run: |
          echo '### Android check log' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f check-android.log ]; then cat check-android.log >> "$GITHUB_STEP_SUMMARY"; else echo 'No check-android.log was created.' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build release (Android)
        run: cargo ndk -t arm64-v8a -o dist_test/android build --release --lib

      - name: Package signed APK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set" >&2
            exit 1
          fi

          BUILD_TOOLS="$SDK_ROOT/build-tools/34.0.0"
          AAPT2="$BUILD_TOOLS/aapt2"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ANDROID_JAR="$SDK_ROOT/platforms/android-34/android.jar"

          for tool in "$AAPT2" "$ZIPALIGN" "$APKSIGNER"; do
            test -x "$tool" || { echo "Missing Android build tool: $tool" >&2; exit 1; }
          done
          test -f "$ANDROID_JAR" || { echo "Missing Android platform jar: $ANDROID_JAR" >&2; exit 1; }

          SO_PATH="$(find dist_test/android -type f -name 'libmy_vault_rs.so' -print -quit)"
          if [ -z "$SO_PATH" ]; then
            echo "libmy_vault_rs.so was not produced by cargo ndk" >&2
            find dist_test/android -type f -print || true
            exit 1
          fi

          mkdir -p dist_test/apk/lib/arm64-v8a
          cp "$SO_PATH" dist_test/apk/lib/arm64-v8a/libmy_vault_rs.so
          chmod 644 dist_test/apk/lib/arm64-v8a/libmy_vault_rs.so

          "$AAPT2" link \
            --manifest android/AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -o dist_test/apk/mawthooq-unsigned-unaligned.apk \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 1 \
            --version-name 0.1.1

          # Native libraries must be stored uncompressed; zipalign page-aligns them afterwards.
          (cd dist_test/apk && zip -q -0 -r -D mawthooq-unsigned-unaligned.apk lib)

          "$ZIPALIGN" -f -p 4 \
            dist_test/apk/mawthooq-unsigned-unaligned.apk \
            dist_test/apk/mawthooq-unsigned-aligned.apk

          keytool -genkeypair -v \
            -keystore dist_test/mawthooq-debug.keystore \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null

          "$APKSIGNER" sign \
            --ks dist_test/mawthooq-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out dist_test/mawthooq-arm64-v8a.apk \
            dist_test/apk/mawthooq-unsigned-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs dist_test/mawthooq-arm64-v8a.apk
          ls -la dist_test/mawthooq-arm64-v8a.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_vault_rs-android-arm64
          path: dist_test/mawthooq-arm64-v8a.apk
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [linux, windows, android, debian]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release_assets

          cp release_artifacts/my_vault_rs-windows-x86_64/my_vault_rs-windows-x86_64.exe release_assets/
          cp release_artifacts/my_vault_rs-linux-x86_64/my_vault_rs-linux-x86_64 release_assets/
          cp release_artifacts/my_vault_rs-debian-x86_64/my-vault-rs_0.1.1_amd64.deb release_assets/
          cp release_artifacts/my_vault_rs-android-arm64/mawthooq-arm64-v8a.apk release_assets/

          ls -la release_assets
          asset_count="$(find release_assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$asset_count" -ne 4 ]; then
            echo "Expected exactly 4 release assets, found $asset_count" >&2
            ls -la release_assets >&2
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mawthooq ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
